<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="55%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#3d3d55"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="620" width="1600" height="280" fill="url(#road)"/>
  <rect x="0" y="750" width="1600" height="12" fill="#555"/>
  <g fill="#666">
    <rect x="80" y="752" width="80" height="8" rx="2"/>
    <rect x="220" y="752" width="80" height="8" rx="2"/>
    <rect x="360" y="752" width="80" height="8" rx="2"/>
    <rect x="500" y="752" width="80" height="8" rx="2"/>
    <rect x="640" y="752" width="80" height="8" rx="2"/>
    <rect x="780" y="752" width="80" height="8" rx="2"/>
    <rect x="920" y="752" width="80" height="8" rx="2"/>
    <rect x="1060" y="752" width="80" height="8" rx="2"/>
    <rect x="1200" y="752" width="80" height="8" rx="2"/>
    <rect x="1340" y="752" width="80" height="8" rx="2"/>
    <rect x="1480" y="752" width="80" height="8" rx="2"/>
  </g>
  <!-- skyline -->
  <g fill="#252538">
    <rect x="980" y="380" width="70" height="240"/>
    <rect x="1070" y="320" width="55" height="300"/>
    <rect x="1140" y="400" width="90" height="220"/>
    <rect x="1250" y="280" width="40" height="340"/>
    <polygon points="1260,180 1270,280 1250,280" fill="#E91E63" opacity="0.7"/>
    <rect x="1310" y="360" width="80" height="260"/>
    <rect x="1410" y="420" width="100" height="200"/>
  </g>
  <!-- truck -->
  <g transform="translate(220,480)">
    <rect x="0" y="80" width="520" height="90" rx="8" fill="#f5f5f5"/>
    <rect x="520" y="40" width="160" height="130" rx="10" fill="#eee"/>
    <rect x="560" y="55" width="90" height="50" rx="6" fill="#88ccee" opacity="0.7"/>
    <circle cx="90" cy="180" r="36" fill="#222"/>
    <circle cx="90" cy="180" r="18" fill="#888"/>
    <circle cx="250" cy="180" r="36" fill="#222"/>
    <circle cx="250" cy="180" r="18" fill="#888"/>
    <circle cx="580" cy="180" r="36" fill="#222"/>
    <circle cx="580" cy="180" r="18" fill="#888"/>
    <!-- cars on truck -->
    <rect x="40" y="20" width="120" height="50" rx="10" fill="#E91E63"/>
    <rect x="180" y="10" width="130" height="55" rx="10" fill="#ad1457"/>
    <rect x="340" y="25" width="110" height="45" rx="10" fill="#f48fb1"/>
  </g>
  <text x="80" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" opacity="0.25">ROSE VIP</text>
</svg>
